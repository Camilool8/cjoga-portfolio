# Runs under nginxinc/nginx-unprivileged (uid 101): pid + temp paths live
# in /tmp so the container works non-root and with readOnlyRootFilesystem
# (an emptyDir is mounted at /tmp by the k8s manifests).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # Don't advertise the nginx version in headers/error pages.
  server_tokens off;

  # Writable paths for the unprivileged worker.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Security headers for the static Docusaurus site. Docusaurus needs
  # inline scripts (theme bootstrap) and inline styles; fonts come from
  # Google Fonts; Mermaid/diagram rendering uses data: images.
  # NOTE: nginx `add_header` inheritance is all-or-nothing per level —
  # any location that adds its own header must repeat these (see the
  # `include` below).
  map $host $csp_value {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (always => also on 404/error responses).
    add_header Content-Security-Policy $csp_value always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real 404s: the built 404.html, not a soft-200 of the homepage.
    error_page 404 /404.html;

    # Hashed build output (/assets/js, /assets/css, /assets/images) is
    # content-fingerprinted by Docusaurus — safe to cache forever.
    # ^~ so the image-extension regex below can't shadow hashed assets.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Security-Policy $csp_value always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri =404;
    }

    # Non-hashed images (/img/** OG cards, logos, favicons) get replaced in
    # place — short cache + stale-while-revalidate instead of a year.
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|otf|eot)$ {
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
      add_header Content-Security-Policy $csp_value always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri =404;
    }

    # HTML is short-cached so deploys are visible quickly. Unknown paths
    # are real 404s (handled by error_page above).
    location / {
      add_header Cache-Control "no-cache, must-revalidate";
      add_header Content-Security-Policy $csp_value always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri $uri/ $uri.html =404;
    }

    # Health endpoint for Kubernetes readiness/liveness in kp-k8s-dev.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
