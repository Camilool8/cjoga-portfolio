    <!-- Fonts are self-hosted (see @font-face in src/styles/global.css),
         discovered from the stylesheet. Not preloaded: on a slow link a
         96 KB font preload competes with the render-blocking CSS and
         delays first paint, while the font itself arrives no sooner. -->

    <!-- Motion safety net. Section reveals start hidden and are faded in
         by the app; if scripts are off, or the app has not mounted within
         4s (blocked or failed bundle), show everything in <main> as is. -->
    <style>
      .motion-fallback main [style*="opacity:0"],
      .motion-fallback main [style*="opacity: 0"] {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    </style>
    <noscript>
      <style>
        main [style*="opacity:0"],
        main [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
    <script>
      // First frame ≈ when the prerendered hero's CSS entrance starts;
      // main.jsx uses it to resume, not replay, that entrance.
      requestAnimationFrame(function () {
        window.__t0 = performance.now();
      });
      setTimeout(function () {
        if (!window.__appReady) document.documentElement.classList.add("motion-fallback");
      }, 4000);
    </script>

    <!-- Structured data: Person + WebSite — feeds rich-result eligibility
         and helps disambiguate the name across search results. -->
    <script type="application/ld+json">

    }
    </script>

    <!-- Theme bootstrap — paints in the correct theme on first frame.
         Mirrors Docusaurus's three-state model: localStorage "light" or
         "dark" is an explicit user choice; anything else (including no
         entry) is "system" and resolves to prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var pref =
            stored === "light" || stored === "dark" ? stored : "system";
          var theme =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage unavailable in private browsing — CSS default. */
        }
      })();
    </script>
