name: Build & push Docker images

# Triggers:
#   - pull_request → run the test suite only (no image build/push), so a
#     red suite is visible before merge
#   - push to main → test, then build whichever image's files changed
#   - workflow_dispatch → force-build both, useful for re-rolling after
#     base-image security updates without touching app code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid stacking redundant runs if you push twice in a row to main.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All actions are pinned to full commit SHAs (supply-chain hardening —
# a compromised tag can't exfiltrate DOCKERHUB_TOKEN). The comment on
# each pin is the human-readable release it resolves to.
jobs:
  # Detect which app changed so we don't rebuild images on doc-only
  # commits or when only the sibling app's files moved.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      portfolio: ${{ steps.filter.outputs.portfolio }}
      blog: ${{ steps.filter.outputs.blog }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            portfolio:
              - 'src/**'
              - 'server/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'vite.config.js'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'index.html'
              - '.github/workflows/build-images.yaml'
            blog:
              - 'blog-site/**'
              - '.github/workflows/build-images.yaml'

  # Test suite + translation-key parity. Runs on PRs (the whole point:
  # surface failures before merge) and gates the image build on push.
  portfolio-tests:
    name: Test portfolio
    needs: changes
    if: needs.changes.outputs.portfolio == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # The server route tests assert against the built SPA (dist/ is
      # gitignored): SPA shell + prerendered routes, robots.txt, hashed
      # assets, CSP on served pages. Without this step they 404.
      - name: Build SPA
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check translation parity
        run: npm run i18n:check

  portfolio:
    name: Build cjoga/portfolio
    needs: [changes, portfolio-tests]
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.portfolio == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: cjoga/portfolio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio
          provenance: false

  blog:
    name: Build cjoga/blog
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.blog == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: cjoga/blog
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: blog-site
          file: blog-site/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blog
          cache-to: type=gha,mode=max,scope=blog
          provenance: false
