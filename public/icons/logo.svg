<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Orbit C: a C drawn as an orbit, its satellite parked in the gap.
       Pure geometry (no text, no gradient), Signal Mint on the Deep Space
       tile, so it renders the same everywhere and holds at 16px.
       The ring is a 70-unit circle centred at (126, 128); its opening
       spans ±0.62 rad around 0°, and the satellite sits on the ring at 0°. -->

  <!-- Tile -->
  <rect width="256" height="256" rx="58" fill="#0b0f1a"/>

  <!-- Orbit (the C) -->
  <path d="M 182.97 168.67 A 70 70 0 1 1 182.97 87.33"
        fill="none" stroke="#64ffda" stroke-width="28" stroke-linecap="round"/>

  <!-- Satellite -->
  <circle cx="196" cy="128" r="17" fill="#64ffda"/>

  <!-- Hairline edge, so the tile holds its shape on a dark ground -->
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="57.25"
        fill="none" stroke="#64ffda" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
