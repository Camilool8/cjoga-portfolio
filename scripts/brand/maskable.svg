<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Full-bleed Deep Space ground — required for Android adaptive icons,
       which crop to their own shape. -->
  <rect width="256" height="256" fill="#0b0f1a"/>

  <!-- The Orbit C (see mark.svg), scaled to 62% about the centre so it
       sits inside the maskable safe zone (a circle of radius 40%). -->
  <g transform="translate(128 128) scale(0.62) translate(-127.5 -128)">
    <path d="M 182.97 168.67 A 70 70 0 1 1 182.97 87.33"
          fill="none" stroke="#64ffda" stroke-width="28" stroke-linecap="round"/>
    <circle cx="196" cy="128" r="17" fill="#64ffda"/>
  </g>
</svg>
