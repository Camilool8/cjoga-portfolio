# Unchanged from kp-k8s-dev: targetPort is the named container port
# `http`, so it follows the containerPort move 80 → 8080 automatically.
apiVersion: v1
kind: Service
metadata:
  name: blog-svc
  namespace: web-development
  labels:
    app: blog
spec:
  type: ClusterIP
  selector:
    app: blog
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
