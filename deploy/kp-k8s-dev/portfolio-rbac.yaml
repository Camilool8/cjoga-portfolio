# RBAC for the portfolio's live terminal.
#
# The server code enforces its own namespace allowlist
# (TERMINAL_NAMESPACE_ALLOWLIST, default web-development,monitoring) and only
# ever calls list on pods/deployments/services/namespaces/nodes. This RBAC
# makes the cluster say the same thing, so a compromise of the Node process
# can't see more than the terminal was ever meant to show.
#
# Namespaced reads: only the allowlisted namespaces get a Role/RoleBinding.
# Cluster-scoped reads: namespaces + nodes list only (the app filters the
# namespace listing to the allowlist and never exposes node versions).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-terminal
  namespace: web-development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-terminal-read
  namespace: web-development
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-terminal-read
  namespace: web-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-terminal-read
subjects:
  - kind: ServiceAccount
    name: portfolio-terminal
    namespace: web-development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-terminal-read
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-terminal-read
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-terminal-read
subjects:
  - kind: ServiceAccount
    name: portfolio-terminal
    namespace: web-development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-terminal-cluster-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-terminal-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portfolio-terminal-cluster-read
subjects:
  - kind: ServiceAccount
    name: portfolio-terminal
    namespace: web-development
