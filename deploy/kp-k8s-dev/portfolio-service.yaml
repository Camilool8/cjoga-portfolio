# Cleaned copy (the live manifest carried kubectl-applied status/uid fields).
# No functional change needed: targetPort is the named container port
# `http`, so it follows the containerPort move 3000 → 8080 automatically.
apiVersion: v1
kind: Service
metadata:
  name: portfolio-svc
  namespace: web-development
  labels:
    app: portfolio
spec:
  type: ClusterIP
  selector:
    app: portfolio
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
