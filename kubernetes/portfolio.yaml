---
# 1. Deployment for Portfolio Website
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deploy
  namespace: web-development
  labels:
    app: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      serviceAccountName: portfolio-terminal
      containers:
        - name: portfolio-container
          image: cjoga/portfolio:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "80"
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: supabase-anon-key
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
            requests:
              cpu: "0.2"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
# 2. Service to expose the Portfolio Deployment internally
apiVersion: v1
kind: Service
metadata:
  name: portfolio-svc
  namespace: web-development
spec:
  selector:
    app: portfolio
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
# 3. HTTPRoute on Envoy Gateway (Gateway API), as it runs in the cluster:
# public through the Cloudflare Tunnel, internal on the VPN-only gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
  namespace: web-development
spec:
  hostnames:
    - cjoga.cloud
    - www.cjoga.cloud
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: cjoga-cloud-gateway, namespace: envoy-gateway-system, sectionName: https-apex }
    - { group: gateway.networking.k8s.io, kind: Gateway, name: cjoga-cloud-gateway, namespace: envoy-gateway-system, sectionName: https }
    - { group: gateway.networking.k8s.io, kind: Gateway, name: cjoga-cloud-internal-gateway, namespace: envoy-gateway-system, sectionName: https-apex }
    - { group: gateway.networking.k8s.io, kind: Gateway, name: cjoga-cloud-internal-gateway, namespace: envoy-gateway-system, sectionName: https }
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: X-Frame-Options, value: DENY }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: same-origin }
      backendRefs:
        - { kind: Service, name: portfolio-svc, port: 80 }
